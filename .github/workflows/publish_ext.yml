
name: Publish Status Quo Extension

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-status-quo
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Extension Marketplaces
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Validate release version
      - name: Validate version
        if: github.event_name == 'push'
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "Package version: $PACKAGE_VERSION"
          echo "Git tag version: $TAG_VERSION"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Git tag and package.json version do not match"
            exit 1
          fi

      # 4. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 5. Publish to Open VSX
      - name: Publish to Open VSX
        id: openvsx
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          skipDuplicate: true

      # 6. Publish the same VSIX to Visual Studio Marketplace
      - name: Publish to Visual Studio Marketplace
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          registryUrl: https://marketplace.visualstudio.com
          extensionFile: ${{ steps.openvsx.outputs.vsixPath }}
          skipDuplicate: true

      # 7. Report published artifact
      - name: Publication summary
        run: |
          echo "Extension: ashisha7i.status-quo"
          echo "Version: $(node -p "require('./package.json').version")"
          echo "VSIX: ${{ steps.openvsx.outputs.vsixPath }}"
          echo "Published to Open VSX and Visual Studio Marketplace"
